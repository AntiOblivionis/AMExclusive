[mod]
mode=exclusive
period_100ns=200000
allow_resampling=0
output=wasapi
; Ask for the Hi-Res Lossless tier (up to 24/192 ALAC) even when Apple Music
; does not detect an external DAC. Apple caps the request at plain lossless
; (44.1/48 kHz) on built-in endpoints, so Hi-Res is otherwise never offered.
; This only widens the ceiling: tracks that carry no Hi-Res variant still play
; as 44.1 ALAC, and AAC is rejected whenever the item has any lossless variant.
; The output device must accept 192 kHz, or allow_resampling must be on.
force_hires=1

[dlna]
device_udn=
device_name=
location=
buffer_ms=1500
format_pref=lpcm
max_bits=24
manual_urls=
; Bare LPCM (audio/L16, audio/L24) is big-endian per RFC 3551/3190.
; Set to little only for a renderer that violates the spec.
pcm_byte_order=big
; Declared length of the WAV entity handed to the renderer, in seconds.
; A live stream has no length of its own, but renderers of the AURALiC /
; LightningPlayer class refuse a body that carries no total: they probe the
; URL once, then re-request the payload as "Range: bytes=44-" and give up
; with "unsupported format" if no Content-Range total was announced.
; The value is a ceiling, not a measurement: a shorter track simply stops at
; its real end. Keep it above the longest track you play in one go, because
; one session can only deliver this many seconds.
stream_seconds=600
; Ask Windows' media session (SMTC) for the real length of the track Apple
; Music is playing and use that as the declared length instead of the value
; above. 1 = on. With it on, the renderer shows the correct duration and no
; track is ever cut short; stream_seconds is only the fallback when SMTC has
; nothing (Apple Music closed, or a build that does not publish a timeline).
follow_track_duration=1
